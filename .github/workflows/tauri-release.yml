name: Build Tauri Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: Owj-Khatam-CPMAI-Windows-Installer
            args: ''
          - platform: macos-latest
            artifact_name: Owj-Khatam-CPMAI-macOS-Installer
            args: ''
          - platform: ubuntu-22.04
            artifact_name: Owj-Khatam-CPMAI-Linux-Installer
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri installers and publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: 'Owj Khatam CPMAI Desktop ${{ github.event.inputs.release_tag || github.ref_name }}'
          releaseBody: |
            ### نسخه نصبی دسکتاپ سامانه جامع پروپوزال‌های CPMAI قرارگاه خاتم‌الانبیا (ص)
            ساخته‌شده با **Tauri v2** با حفظ ۱۰۰٪ امکانات نسخه وب و اجرای کامل آفلاین:
            - **Windows**: فایل نصبی `Owj-Khatam-CPMAI_1.0.0_x64-setup.exe` (NSIS) و `Owj-Khatam-CPMAI_1.0.0_x64_en-US.msi`
            - **macOS**: فایل نصبی `.dmg`
            - **Linux**: فایل نصبی `.deb` و `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
