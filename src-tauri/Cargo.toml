[package]
name = "owj-khatam-cpmai"
version = "1.0.0"
description = "Owj Business Management Consultants - Khatam al-Anbiya CPMAI v8 Desktop Proposal Suite"
authors = ["Owj Business Management Consultants <info@owjbc.com>"]
edition = "2021"

[lib]
name = "owj_khatam_cpmai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
